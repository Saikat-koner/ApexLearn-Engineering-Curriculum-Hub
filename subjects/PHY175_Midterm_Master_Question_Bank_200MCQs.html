\u2295 B and Carry = A \u00b7 B."}, {"num": 199, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "In a Full Adder circuit with inputs A, B, and Cin, the Sum (S) is given by:", "options": ["A) S = A \u2295 B \u2295 Cin", "B) S = A \u00b7 B \u00b7 Cin", "C) S = A + B + Cin", "D) S = (A \u2295 B) \u00b7 Cin"], "ans": "A", "exp": "Full Adder 3-input odd parity sum is S = A \u2295 B \u2295 Cin."}, {"num": 200, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "The total number of minterms in a Boolean function of n variables is:", "options": ["A) 2\u207f", "B) 2^(2\u207f)", "C) n\u00b2", "D) 2n"], "ans": "A", "exp": "An n-variable Boolean space contains exactly 2\u207f distinct minterms (and 2\u207f maxterms). The total number of distinct switching functions is 2^(2\u207f)."}];
let userAnswers = {};
let currentFilter = 'All';

function renderQuestions(list) {
    const container = document.getElementById('questions-container');
    container.innerHTML = '';

    if (list.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-secondary);">No matching questions found.</div>';
        return;
    }

    list.forEach(item => {
        const card = document.createElement('div');
        card.className = 'q-card';

        let optsHtml = '';
        item.options.forEach((opt, idx) => {
            const optLetter = opt.charAt(0);
            let stateClass = '';
            if (userAnswers[item.num]) {
                if (optLetter === item.ans) {
                    stateClass = 'correct';
                } else if (userAnswers[item.num] === optLetter) {
                    stateClass = 'wrong';
                }
            }
            optsHtml += `<button class="opt-btn ${stateClass}" onclick="selectOpt(${item.num}, '${optLetter}')">${opt}</button>`;
        });

        const isAnswered = !!userAnswers[item.num];
        const expDisplay = isAnswered ? 'block' : 'none';

        card.innerHTML = `
            <div class="q-header">
                <span class="q-unit">${item.unit}</span>
                <span style="font-size: 0.85rem; color: var(--text-secondary); font-weight: 600;">Q${item.num} of 200</span>
            </div>
            <div class="q-title">${item.q}</div>
            <div class="options-grid">${optsHtml}</div>
            <button class="exp-toggle" onclick="toggleExp(${item.num})">${isAnswered ? 'Hide Solution Explanation' : 'Show Solution Explanation'}</button>
            <div class="explanation" id="exp-${item.num}" style="display: ${expDisplay};">
                <strong style="color: var(--accent);">Correct Answer: ${item.ans}</strong><br>
                <span>${item.exp}</span>
            </div>
        `;
        container.appendChild(card);
    });
}

function selectOpt(qNum, letter) {
    userAnswers[qNum] = letter;
    updateStats();
    applyFilters();
}

function toggleExp(qNum) {
    const el = document.getElementById(`exp-${qNum}`);
    if (el) {
        el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }
}

function updateStats() {
    const attempted = Object.keys(userAnswers).length;
    let correct = 0;
    Object.keys(userAnswers).forEach(qNum => {
        const item = mcqs.find(q => q.num == qNum);
        if (item && userAnswers[qNum] === item.ans) {
            correct++;
        }
    });

    document.getElementById('attempted-stat').innerText = attempted;
    document.getElementById('correct-stat').innerText = correct;
    const acc = attempted > 0 ? Math.round((correct / attempted) * 100) : 0;
    document.getElementById('score-stat').innerText = acc + '%';
}

function filterUnit(unit) {
    currentFilter = unit;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    applyFilters();
}

function handleSearch() {
    applyFilters();
}

function applyFilters() {
    const query = document.getElementById('search-input').value.toLowerCase();
    let filtered = mcqs;

    if (currentFilter !== 'All') {
        filtered = filtered.filter(q => q.unit.includes(currentFilter));
    }

    if (query.trim() !== '') {
        filtered = filtered.filter(q =>
            q.q.toLowerCase().includes(query) ||
            q.exp.toLowerCase().includes(query) ||
            q.options.some(o => o.toLowerCase().includes(query))
        );
    }

    renderQuestions(filtered);
}

// Initial render
renderQuestions(mcqs);
</script>
