<script>
const mcqs = [{"num": 1, "unit": "Unit 1: Solid State Physics", "q": "According to the Classical Free Electron Theory of Drude and Lorentz (1900), valence electrons in metals are assumed to behave as:", "options": ["A) Quantum bound harmonic oscillators", "B) A classical ideal gas of free particles colliding elastically with positive ion cores", "C) Immobile particles tightly locked to lattice sites", "D) Fermions strictly obeying the Pauli exclusion principle at all temperatures"], "ans": "B", "exp": "Drude-Lorentz theory treats conduction electrons as a classical gas of free particles undergoing elastic collisions with stationary positive ion cores."}, {"num": 2, "unit": "Unit 1: Solid State Physics", "q": "The microscopic form of Ohm's Law relates current density J and electric field E through electrical conductivity \u03c3 as:", "options": ["A) J = \u03c3 / E", "B) J = \u03c3 \u00b7 E", "C) E = \u03c3 \u00b7 J", "D) J = \u03c3\u00b2 \u00b7 E"], "ans": "B", "exp": "Microscopic Ohm's Law is J = \u03c3 E, derived from J = n\u00b7e\u00b7vd and vd = (e\u00b7E\u00b7\u03c4/m)."}, {"num": 3, "unit": "Unit 1: Solid State Physics", "q": "The electrical conductivity \u03c3 of a metal in classical free electron theory is given by:", "options": ["A) \u03c3 = (n e\u00b2 \u03c4) / m", "B) \u03c3 = (n e \u03c4) / m\u00b2", "C) \u03c3 = (n\u00b2 e \u03c4) / m", "D) \u03c3 = m / (n e\u00b2 \u03c4)"], "ans": "A", "exp": "From J = n\u00b7e\u00b7vd = n\u00b7e\u00b7(e\u00b7E\u00b7\u03c4/m) = (n\u00b7e\u00b2\u00b7\u03c4/m)\u00b7E, comparing with J = \u03c3\u00b7E gives \u03c3 = (n\u00b7e\u00b2\u00b7\u03c4)/m."}, {"num": 4, "unit": "Unit 1: Solid State Physics", "q": "The Wiedemann-Franz Law states that for metals at a given temperature, the ratio of thermal conductivity (K) to electrical conductivity (\u03c3) is:", "options": ["A) Inversely proportional to absolute temperature T", "B) Directly proportional to absolute temperature T (K/\u03c3 \u221d T)", "C) Proportional to T\u00b2", "D) Independent of temperature"], "ans": "B", "exp": "Wiedemann-Franz Law: K / (\u03c3 T) = L (Lorentz Number = 2.44 \u00d7 10\u207b\u2078 W\u00b7\u03a9/K\u00b2), meaning K/\u03c3 is directly proportional to T."}, {"num": 5, "unit": "Unit 1: Solid State Physics", "q": "Which of the following experimental observations represents a critical failure of classical Drude-Lorentz theory?", "options": ["A) Inability to derive Ohm's law", "B) Predicting an electronic molar heat capacity of (3/2)R, whereas the experimental value is ~0.01R at 300 K", "C) Explanation of high electrical conductivity in copper", "D) Explaining why metals reflect light"], "ans": "B", "exp": "Classical equipartition predicted Cv,el = 3/2 R, but experimentally it is ~100 times smaller because only a tiny fraction of electrons near the Fermi level absorb thermal energy."}, {"num": 6, "unit": "Unit 1: Solid State Physics", "q": "Classical free electron theory predicts the temperature dependence of electrical resistivity of metals as \u03c1 \u221d \u221aT, whereas experiments show:", "options": ["A) \u03c1 \u221d 1/T", "B) \u03c1 \u221d T", "C) \u03c1 \u221d T\u00b3", "D) \u03c1 is independent of T"], "ans": "B", "exp": "Experimentally, resistivity of pure metals increases linearly with temperature (\u03c1 \u221d T) due to lattice vibration (phonon) scattering."}, {"num": 7, "unit": "Unit 1: Solid State Physics", "q": "Quantum Free Electron Theory was proposed by Arnold Sommerfeld in 1928 by applying:", "options": ["A) Maxwell-Boltzmann classical statistics", "B) Fermi-Dirac quantum statistics and Pauli Exclusion Principle", "C) Bohr's planetary model of atom", "D) Newton's laws of motion exclusively"], "ans": "B", "exp": "Sommerfeld resolved classical discrepancies by treating electrons as quantum fermions obeying Pauli exclusion and Fermi-Dirac statistics."}, {"num": 8, "unit": "Unit 1: Solid State Physics", "q": "The drift velocity vd of free electrons in a conductor is mathematically defined as:", "options": ["A) vd = \u03bc / E", "B) vd = \u03bc \u00b7 E = (e E \u03c4 / m)", "C) vd = e E / (m \u03c4)", "D) vd = m / (e E \u03c4)"], "ans": "B", "exp": "Drift velocity is the net velocity acquired in an electric field: vd = \u03bc E = (e \u03c4 / m) E."}, {"num": 9, "unit": "Unit 1: Solid State Physics", "q": "Relaxation time (\u03c4) of a conduction electron is defined as the average time:", "options": ["A) Taken by an electron to traverse the conductor length", "B) Elapsed between two successive collisions with lattice ions", "C) Required for an electron to escape into vacuum", "D) Required for an electron to recombine with a hole"], "ans": "B", "exp": "Relaxation time \u03c4 is the mean time interval between two successive collisions of a conduction electron."}, {"num": 10, "unit": "Unit 1: Solid State Physics", "q": "Mobility (\u03bc) of charge carriers is defined as:", "options": ["A) Drift velocity per unit electric field (vd / E)", "B) Electric field per unit drift velocity (E / vd)", "C) Current density per unit charge (J / q)", "D) Diffusion coefficient per unit time (D / t)"], "ans": "A", "exp": "Mobility is defined as drift velocity acquired per unit applied electric field: \u03bc = vd / E = e \u03c4 / m."}, {"num": 11, "unit": "Unit 1: Solid State Physics", "q": "Drift current is produced by ________, whereas diffusion current is produced by ________.", "options": ["A) Carrier concentration gradient; Applied electric field", "B) Applied electric field; Carrier concentration gradient", "C) Magnetic field; Thermal gradient", "D) Mechanical stress; Optical illumination"], "ans": "B", "exp": "Drift current arises from carrier acceleration in an electric field, while diffusion current arises from spatial variations in carrier concentration."}, {"num": 12, "unit": "Unit 1: Solid State Physics", "q": "The Einstein relation connecting diffusion coefficient (D) and mobility (\u03bc) of charge carriers at temperature T is:", "options": ["A) D / \u03bc = kB T / q = VT", "B) \u03bc / D = kB T / q", "C) D \u00b7 \u03bc = kB T / q", "D) D / \u03bc = q / (kB T)"], "ans": "A", "exp": "Einstein relation: D / \u03bc = (kB T / q) = VT (Thermal voltage \u2248 26 mV at 300 K)."}, {"num": 13, "unit": "Unit 1: Solid State Physics", "q": "The total current density J in a semiconductor containing both electrons and holes is given by:", "options": ["A) J = q(n \u03bcn + p \u03bcp)E + q Dn (dn/dx) - q Dp (dp/dx)", "B) J = q(n \u03bcn - p \u03bcp)E + q Dn (dn/dx) + q Dp (dp/dx)", "C) J = q(n \u03bcn + p \u03bcp)E - q Dn (dn/dx) - q Dp (dp/dx)", "D) J = \u03c3 E + q Dn (dp/dx)"], "ans": "A", "exp": "Total current J = J_drift + J_diff = q(n \u03bcn + p \u03bcp)E + q Dn (dn/dx) - q Dp (dp/dx). The minus sign on hole diffusion reflects positive charge moving down the gradient."}, {"num": 14, "unit": "Unit 1: Solid State Physics", "q": "The forbidden energy gap (Eg) in solids is defined as the energy difference between:", "options": ["A) Bottom of Valence Band and Top of Conduction Band", "B) Top of Valence Band (Ev) and Bottom of Conduction Band (Ec)", "C) Fermi level and vacuum level", "D) Donor level and acceptor level"], "ans": "B", "exp": "Eg = Ec - Ev, the forbidden energy span between the highest valence state and lowest conduction state."}, {"num": 15, "unit": "Unit 1: Solid State Physics", "q": "At room temperature (300 K), the forbidden energy gaps of Silicon (Si) and Germanium (Ge) are approximately:", "options": ["A) 0.67 eV and 1.1 eV", "B) 1.1 eV and 0.67 eV", "C) 1.42 eV and 5.4 eV", "D) 0 eV and 1.1 eV"], "ans": "B", "exp": "Eg(Si) \u2248 1.1 eV and Eg(Ge) \u2248 0.67 eV at room temperature."}, {"num": 16, "unit": "Unit 1: Solid State Physics", "q": "In conductors (metals), the valence band and conduction band:", "options": ["A) Are separated by an energy gap greater than 5 eV", "B) Overlap or the valence band is partially filled", "C) Are completely empty at 0 K", "D) Are separated by exactly 1.1 eV"], "ans": "B", "exp": "In metals, the conduction and valence bands overlap (Eg = 0), providing abundant free electrons for conduction."}, {"num": 17, "unit": "Unit 1: Solid State Physics", "q": "Insulators like diamond have a forbidden energy gap Eg that is typically:", "options": ["A) Exactly 0 eV", "B) Around 1 eV", "C) Greater than 3 to 5 eV (~5.4 eV for diamond)", "D) Negative"], "ans": "C", "exp": "Insulators have wide bandgaps (Eg > 3 to 5 eV; diamond is ~5.4 eV), preventing thermal excitation across the gap."}, {"num": 18, "unit": "Unit 1: Solid State Physics", "q": "The temperature coefficient of resistance (\u03b1) for intrinsic semiconductors is:", "options": ["A) Positive (resistance increases with temperature)", "B) Negative (resistance decreases / conductivity increases exponentially with temperature)", "C) Zero at all temperatures", "D) Infinite"], "ans": "B", "exp": "Semiconductors have a negative temperature coefficient of resistance (\u03b1 < 0); thermal energy generates electron-hole pairs, drastically boosting conductivity."}, {"num": 19, "unit": "Unit 1: Solid State Physics", "q": "At absolute zero temperature (0 K), an ideal pure intrinsic semiconductor behaves as a:", "options": ["A) Superconductor", "B) Perfect conductor", "C) Perfect insulator", "D) Semiconductor with high current"], "ans": "C", "exp": "At 0 K, no thermal energy exists to break covalent bonds; VB is completely full, CB is completely empty."}, {"num": 20, "unit": "Unit 1: Solid State Physics", "q": "An intrinsic semiconductor crystal (such as pure Silicon) is held together by:", "options": ["A) Ionic bonds", "B) Covalent bonds", "C) Metallic bonds", "D) Hydrogen bonds"], "ans": "B", "exp": "Silicon and Germanium atoms (Group IV) share 4 valence electrons with 4 neighboring atoms via covalent bonds."}, {"num": 21, "unit": "Unit 1: Solid State Physics", "q": "In an intrinsic semiconductor under thermal equilibrium, the carrier concentrations satisfy:", "options": ["A) n > p", "B) p > n", "C) n = p = ni", "D) n \u00b7 p = 0"], "ans": "C", "exp": "Thermal bond rupture generates one electron in CB and one hole in VB simultaneously, so n = p = ni."}, {"num": 22, "unit": "Unit 1: Solid State Physics", "q": "The Mass Action Law states that in any semiconductor under thermal equilibrium:", "options": ["A) n + p = ni", "B) n \u00b7 p = ni\u00b2", "C) n / p = ni\u00b2", "D) n \u00b7 p = 2 ni"], "ans": "B", "exp": "Mass Action Law: n \u00b7 p = ni\u00b2 at a constant temperature, valid for both intrinsic and extrinsic semiconductors."}, {"num": 23, "unit": "Unit 1: Solid State Physics", "q": "Silicon is preferred over Germanium in modern semiconductor electronics primarily because:", "options": ["A) Si has a smaller bandgap than Ge", "B) Si has a larger bandgap (1.1 eV vs 0.67 eV), resulting in much lower reverse leakage current and higher temperature stability", "C) Si has higher electron mobility than Ge", "D) Ge is completely non-conductive"], "ans": "B", "exp": "Si has larger Eg, smaller reverse saturation current, higher operating temperature (up to 200\u00b0C vs 85\u00b0C for Ge), and forms stable native SiO2."}, {"num": 24, "unit": "Unit 1: Solid State Physics", "q": "When pure Silicon is doped with a Pentavalent impurity (such as Phosphorus, Arsenic, or Antimony):", "options": ["A) P-type semiconductor is created", "B) N-type semiconductor is created with donor energy level Ed just below the conduction band", "C) The crystal becomes negatively charged overall", "D) Carrier concentration drops to zero"], "ans": "B", "exp": "Pentavalent atoms donate free electrons to CB, creating an N-type semiconductor with donor level Ed ~0.05 eV below Ec."}, {"num": 25, "unit": "Unit 1: Solid State Physics", "q": "When pure Silicon is doped with a Trivalent impurity (such as Boron, Aluminum, Gallium, or Indium):", "options": ["A) N-type semiconductor is formed", "B) P-type semiconductor is formed with acceptor energy level Ea just above the valence band", "C) The crystal becomes positively charged overall", "D) Electron concentration exceeds hole concentration"], "ans": "B", "exp": "Trivalent atoms accept electrons to complete bonds, creating holes in VB and forming P-type material with Ea ~0.05 eV above Ev."}, {"num": 26, "unit": "Unit 1: Solid State Physics", "q": "An N-type semiconductor as a whole is:", "options": ["A) Negatively charged", "B) Positively charged", "C) Electrically neutral", "D) Positively charged only at high temperatures"], "ans": "C", "exp": "An N-type crystal is electrically neutral because fixed positive donor ions exactly balance free electrons."}, {"num": 27, "unit": "Unit 1: Solid State Physics", "q": "In an N-type semiconductor, the majority carriers are ________ and minority carriers are ________.", "options": ["A) Holes; Electrons", "B) Electrons; Holes", "C) Protons; Neutrons", "D) Ions; Holes"], "ans": "B", "exp": "In N-type material, electrons are majority carriers (n \u2248 ND) and holes are minority carriers (p = ni\u00b2 / ND)."}, {"num": 28, "unit": "Unit 1: Solid State Physics", "q": "The Fermi-Dirac distribution function f(E) gives the probability that an available energy state E is:", "options": ["A) Empty at absolute zero", "B) Occupied by an electron at temperature T", "C) Generating a photon", "D) Radiating thermal energy"], "ans": "B", "exp": "f(E) = 1 / [1 + exp((E - EF)/kB T)] represents the probability of electron occupancy of state E at temperature T."}, {"num": 29, "unit": "Unit 1: Solid State Physics", "q": "At any temperature T > 0 K, the probability of finding an electron at the Fermi level E = EF is exactly:", "options": ["A) 1.0 (100%)", "B) 0.5 (50%)", "C) 0.0 (0%)", "D) 0.25 (25%)"], "ans": "B", "exp": "f(EF) = 1 / [1 + exp((EF - EF)/kB T)] = 1 / [1 + exp(0)] = 1 / 2 = 0.5."}, {"num": 30, "unit": "Unit 1: Solid State Physics", "q": "In an intrinsic semiconductor, the Fermi level EF lies:", "options": ["A) Near the conduction band edge Ec", "B) Near the valence band edge Ev", "C) Exactly at the center of the forbidden bandgap (Ec + Ev)/2", "D) Inside the conduction band"], "ans": "C", "exp": "Since electron and hole densities are equal in intrinsic semiconductor, EF = (Ec + Ev)/2."}, {"num": 31, "unit": "Unit 1: Solid State Physics", "q": "In an N-type semiconductor, as doping concentration increases, the Fermi level EF:", "options": ["A) Shifts downward towards the valence band", "B) Shifts upward closer to the conduction band edge Ec", "C) Remains strictly at the middle of the bandgap", "D) Drops into the valence band"], "ans": "B", "exp": "Adding donor impurities increases electron density, pushing EF upward toward Ec."}, {"num": 32, "unit": "Unit 1: Solid State Physics", "q": "In a P-type semiconductor, the Fermi level EF lies:", "options": ["A) Closer to the valence band edge Ev", "B) Closer to the conduction band edge Ec", "C) Outside the crystal", "D) At the exact top of the conduction band"], "ans": "A", "exp": "Adding acceptor impurities increases hole concentration, pulling EF down toward Ev."}, {"num": 33, "unit": "Unit 1: Solid State Physics", "q": "When a magnetic field B is applied perpendicular to a current I in a semiconductor, the resulting transverse electric field is called the:", "options": ["A) Seebeck field", "B) Hall electric field (EH)", "C) Peltier field", "D) Faraday field"], "ans": "B", "exp": "The transverse field established across the conductor to balance the Lorentz force is the Hall electric field EH."}, {"num": 34, "unit": "Unit 1: Solid State Physics", "q": "The Hall voltage VH across a sample of thickness t carrying current I in magnetic field B is given by:", "options": ["A) VH = (RH \u00b7 B \u00b7 I) / t", "B) VH = (RH \u00b7 t) / (B \u00b7 I)", "C) VH = RH \u00b7 B \u00b7 I \u00b7 t", "D) VH = (B \u00b7 I) / (RH \u00b7 t)"], "ans": "A", "exp": "VH = EH \u00b7 w = (RH \u00b7 J \u00b7 B) \u00b7 w = RH (I / (w t)) B w = (RH B I) / t."}, {"num": 35, "unit": "Unit 1: Solid State Physics", "q": "The Hall coefficient RH for an N-type semiconductor is:", "options": ["A) Positive (RH > 0)", "B) Negative (RH = -1/(n e) < 0)", "C) Exactly zero", "D) Imaginary"], "ans": "B", "exp": "For electrons (charge -e), RH = -1 / (n e), which is negative."}, {"num": 36, "unit": "Unit 1: Solid State Physics", "q": "The Hall coefficient RH for a P-type semiconductor is:", "options": ["A) Positive (RH = +1/(p e) > 0)", "B) Negative (RH < 0)", "C) Zero", "D) Dependent only on magnetic field"], "ans": "A", "exp": "For holes (charge +e), RH = +1 / (p e), which is positive."}, {"num": 37, "unit": "Unit 1: Solid State Physics", "q": "Hall mobility \u03bcH of charge carriers is related to conductivity \u03c3 and Hall coefficient RH by:", "options": ["A) \u03bcH = \u03c3 / |RH|", "B) \u03bcH = \u03c3 \u00b7 |RH|", "C) \u03bcH = |RH| / \u03c3", "D) \u03bcH = \u03c3\u00b2 \u00b7 |RH|"], "ans": "B", "exp": "Since \u03c3 = n e \u03bc and |RH| = 1/(n e), we have \u03bcH = \u03c3 \u00b7 |RH|."}, {"num": 38, "unit": "Unit 1: Solid State Physics", "q": "A copper wire carries current I = 5 A. If electron density n = 8.5 \u00d7 10\u00b2\u2078 m\u207b\u00b3 and cross-sectional area A = 1.0 \u00d7 10\u207b\u2076 m\u00b2, the electron drift speed vd is: (e = 1.6 \u00d7 10\u207b\u00b9\u2079 C)", "options": ["A) 3.68 \u00d7 10\u207b\u2074 m/s", "B) 3.68 \u00d7 10\u2074 m/s", "C) 1.25 \u00d7 10\u207b\u00b2 m/s", "D) 3.0 \u00d7 10\u2078 m/s"], "ans": "A", "exp": "vd = I / (n e A) = 5 / (8.5e28 * 1.6e-19 * 1e-6) = 5 / 13600 = 3.68 \u00d7 10\u207b\u2074 m/s."}, {"num": 39, "unit": "Unit 1: Solid State Physics", "q": "A Silicon sample is doped with ND = 10\u00b9\u2077 cm\u207b\u00b3 of Phosphorus. If ni = 1.5 \u00d7 10\u00b9\u2070 cm\u207b\u00b3, the minority hole concentration p is:", "options": ["A) 1.5 \u00d7 10\u00b3 cm\u207b\u00b3", "B) 2.25 \u00d7 10\u00b3 cm\u207b\u00b3", "C) 2.25 \u00d7 10\u00b9\u2070 cm\u207b\u00b3", "D) 10\u00b9\u2077 cm\u207b\u00b3"], "ans": "B", "exp": "p = ni\u00b2 / ND = (1.5 \u00d7 10\u00b9\u2070)\u00b2 / 10\u00b9\u2077 = 2.25 \u00d7 10\u00b2\u2070 / 10\u00b9\u2077 = 2.25 \u00d7 10\u00b3 cm\u207b\u00b3."}, {"num": 40, "unit": "Unit 1: Solid State Physics", "q": "A semiconductor slab of thickness 0.5 mm carrying 10 mA in B = 0.5 T has RH = 0.05 m\u00b3/C. The Hall voltage VH is:", "options": ["A) 0.5 mV", "B) 5.0 mV", "C) 0.05 V", "D) 0.5 V"], "ans": "A", "exp": "VH = (RH B I) / t = (0.05 * 0.5 * 0.01) / (0.5 \u00d7 10\u207b\u00b3) = 0.00025 / 0.0005 = 0.5 mV."}, {"num": 41, "unit": "Unit 1: Solid State Physics", "q": "If the Hall coefficient RH of a semiconductor is +1.25 \u00d7 10\u207b\u2074 m\u00b3/C, the carrier concentration is:", "options": ["A) 5 \u00d7 10\u00b2\u00b2 m\u207b\u00b3 holes", "B) 5 \u00d7 10\u00b2\u00b2 m\u207b\u00b3 electrons", "C) 1.25 \u00d7 10\u00b2\u2070 m\u207b\u00b3 holes", "D) 8 \u00d7 10\u00b2\u00b9 m\u207b\u00b3 electrons"], "ans": "A", "exp": "Positive RH means holes (P-type). p = 1 / (e RH) = 1 / (1.6e-19 * 1.25e-4) = 5 \u00d7 10\u00b2\u00b2 m\u207b\u00b3."}, {"num": 42, "unit": "Unit 1: Solid State Physics", "q": "Which of the following is NOT an application of the Hall effect?", "options": ["A) Determining whether a semiconductor is N-type or P-type", "B) Measuring carrier concentration and mobility", "C) Measuring unknown magnetic field B", "D) Directly measuring the speed of light in vacuum"], "ans": "D", "exp": "Hall effect measures carrier polarity, concentration, mobility, and magnetic fields, not the speed of light."}, {"num": 43, "unit": "Unit 1: Solid State Physics", "q": "In a pure semiconductor, when temperature increases from 300 K to 400 K, the electrical conductivity:", "options": ["A) Decreases linearly", "B) Increases exponentially", "C) Drops to zero", "D) Remains strictly constant"], "ans": "B", "exp": "Conductivity increases exponentially as \u03c3 \u221d exp(-Eg / 2kB T) due to rapid generation of electron-hole pairs."}, {"num": 44, "unit": "Unit 1: Solid State Physics", "q": "In an N-type semiconductor, the donor energy level Ed lies:", "options": ["A) In the middle of the forbidden gap", "B) Just below the bottom of the conduction band Ec", "C) Just above the top of the valence band Ev", "D) Inside the valence band"], "ans": "B", "exp": "Donor level Ed is very close to Ec (~0.05 eV in Si), making ionization very easy at room temperature."}, {"num": 45, "unit": "Unit 1: Solid State Physics", "q": "In a P-type semiconductor, the acceptor energy level Ea lies:", "options": ["A) In the middle of the conduction band", "B) Just above the top of the valence band Ev", "C) Just below the bottom of the conduction band Ec", "D) Outside the energy band diagram"], "ans": "B", "exp": "Acceptor level Ea lies just above Ev (~0.05 eV in Si), readily accepting electrons from VB."}, {"num": 46, "unit": "Unit 1: Solid State Physics", "q": "The unit of Hall coefficient RH in SI units is:", "options": ["A) m\u00b3 / C", "B) V / m", "C) \u03a9 \u00b7 m", "D) C / m\u00b2"], "ans": "A", "exp": "RH = 1 / (n q) = 1 / (m\u207b\u00b3 \u00b7 C) = m\u00b3 / C (or m\u00b3 / A\u00b7s)."}, {"num": 47, "unit": "Unit 1: Solid State Physics", "q": "The unit of carrier mobility \u03bc is:", "options": ["A) m\u00b2 / (V \u00b7 s)", "B) V / (m \u00b7 s)", "C) m / s\u00b2", "D) \u03a9 \u00b7 m\u00b2"], "ans": "A", "exp": "\u03bc = vd / E = (m/s) / (V/m) = m\u00b2 / (V\u00b7s) (or cm\u00b2 / V\u00b7s)."}, {"num": 48, "unit": "Unit 1: Solid State Physics", "q": "Thermal voltage VT at room temperature (T = 300 K) is approximately equal to:", "options": ["A) 0.7 V", "B) 0.3 V", "C) 26 mV (0.0259 V)", "D) 1.1 V"], "ans": "C", "exp": "VT = kB T / q = (1.38 \u00d7 10\u207b\u00b2\u00b3 * 300) / (1.6 \u00d7 10\u207b\u00b9\u2079) \u2248 0.02586 V \u2248 26 mV."}, {"num": 49, "unit": "Unit 1: Solid State Physics", "q": "When a semiconductor is illuminated by light with photon energy h\u03bd < Eg:", "options": ["A) Intense electron-hole pairs are created", "B) No electron-hole pairs are generated (semiconductor is transparent)", "C) The semiconductor becomes a superconductor", "D) The bandgap collapses to zero"], "ans": "B", "exp": "Photons with energy below Eg cannot excite electrons across the bandgap, so the material is transparent."}, {"num": 50, "unit": "Unit 1: Solid State Physics", "q": "At very high temperatures, an extrinsic doped semiconductor behaves as:", "options": ["A) An insulator", "B) An intrinsic semiconductor (intrinsic carrier generation overwhelms dopant density)", "C) A superconductor", "D) A pure metal with overlapping bands"], "ans": "B", "exp": "At high T, thermally generated ni >> ND or NA, causing the material to behave like an intrinsic semiconductor."}, {"num": 51, "unit": "Unit 1: Solid State Physics", "q": "Mean free path \u03bb of conduction electrons is related to drift velocity vd and relaxation time \u03c4 as:", "options": ["A) \u03bb = vd \u00b7 \u03c4", "B) \u03bb = vd / \u03c4", "C) \u03bb = \u03c4 / vd", "D) \u03bb = vd\u00b2 \u00b7 \u03c4"], "ans": "A", "exp": "Mean free path \u03bb is the average distance between collisions: \u03bb = vd \u00b7 \u03c4."}, {"num": 52, "unit": "Unit 1: Solid State Physics", "q": "For an energy state E located 3 kB T above the Fermi level (E - EF = 3 kB T), the Fermi-Dirac occupation probability f(E) is:", "options": ["A) 1 / (1 + e\u00b3)", "B) 1 / (1 + e\u207b\u00b3)", "C) 0.5", "D) 1.0"], "ans": "A", "exp": "f(E) = 1 / [1 + exp((E - EF)/kB T)] = 1 / [1 + exp(3)] \u2248 1 / (1 + 20.08) \u2248 0.047 (4.7%)."}, {"num": 53, "unit": "Unit 1: Solid State Physics", "q": "For an energy state E located 3 kB T below the Fermi level (E - EF = -3 kB T), the probability of finding a hole (unoccupied state) is:", "options": ["A) 1 / (1 + e\u00b3)", "B) 1 / (1 + e\u207b\u00b3)", "C) 0.5", "D) 0.95"], "ans": "A", "exp": "Probability of being empty 1 - f(E) = 1 - 1/(1 + e\u207b\u00b3) = e\u207b\u00b3 / (1 + e\u207b\u00b3) = 1 / (1 + e\u00b3)."}, {"num": 54, "unit": "Unit 1: Solid State Physics", "q": "Which of the following elements is a trivalent acceptor dopant for Silicon?", "options": ["A) Phosphorus (P)", "B) Arsenic (As)", "C) Boron (B)", "D) Antimony (Sb)"], "ans": "C", "exp": "Boron (Group III) is trivalent; P, As, Sb (Group V) are pentavalent donors."}, {"num": 55, "unit": "Unit 1: Solid State Physics", "q": "Which of the following elements is a pentavalent donor dopant for Silicon?", "options": ["A) Boron (B)", "B) Gallium (Ga)", "C) Arsenic (As)", "D) Indium (In)"], "ans": "C", "exp": "Arsenic (Group V) is pentavalent; B, Ga, In (Group III) are trivalent."}, {"num": 56, "unit": "Unit 1: Solid State Physics", "q": "In a Hall effect setup, if current I flows in +x direction and magnetic field B is applied in +z direction, electrons experience Lorentz force in:", "options": ["A) +y direction", "B) -y direction", "C) +z direction", "D) -x direction"], "ans": "B", "exp": "Electrons drift in -x direction. Lorentz force F = -e (v \u00d7 B) = -e ((-v x\u0302) \u00d7 (B z\u0302)) = -e (v B y\u0302) = -y direction."}, {"num": 57, "unit": "Unit 1: Solid State Physics", "q": "If electrical conductivity of a semiconductor is \u03c3 = 100 S/m and RH = 0.02 m\u00b3/C, the carrier mobility is:", "options": ["A) 2 m\u00b2/(V\u00b7s)", "B) 5000 m\u00b2/(V\u00b7s)", "C) 0.0002 m\u00b2/(V\u00b7s)", "D) 200 m\u00b2/(V\u00b7s)"], "ans": "A", "exp": "\u03bc = \u03c3 \u00b7 RH = 100 * 0.02 = 2 m\u00b2 / (V\u00b7s)."}, {"num": 58, "unit": "Unit 1: Solid State Physics", "q": "The concept of 'effective mass' of an electron arises in:", "options": ["A) Drude classical theory", "B) Band theory of solids due to electron interaction with periodic crystal lattice potential", "C) Ideal gas laws", "D) Coulomb electrostatic law"], "ans": "B", "exp": "Effective mass m* accounts for the forces exerted on the electron by the periodic crystal potential."}, {"num": 59, "unit": "Unit 1: Solid State Physics", "q": "In Germanium (Ge), the donor level Ed lies approximately ________ below the conduction band edge Ec.", "options": ["A) 0.01 eV", "B) 0.05 eV", "C) 0.67 eV", "D) 1.1 eV"], "ans": "A", "exp": "Ed in Ge is ~0.01 eV below Ec (compared to ~0.05 eV in Si)."}, {"num": 60, "unit": "Unit 1: Solid State Physics", "q": "Direct bandgap semiconductors (like GaAs) differ from indirect bandgap semiconductors (like Si) because:", "options": ["A) Conduction band minimum and Valence band maximum occur at the same crystal momentum (k = 0), allowing efficient photon emission", "B) They have zero bandgap", "C) They cannot be doped", "D) Conduction band is always full"], "ans": "A", "exp": "Direct bandgap semiconductors allow direct radiative electron-hole recombination without phonon assistance, making them ideal for LEDs/lasers."}, {"num": 61, "unit": "Unit 1: Solid State Physics", "q": "The Fermi energy EF of a metal at T = 0 K is:", "options": ["A) The energy of the lowest conduction state", "B) The highest occupied energy state at 0 K", "C) Zero for all metals", "D) Infinite"], "ans": "B", "exp": "At 0 K, all energy states up to EF are 100% occupied, and all states above EF are completely empty."}, {"num": 62, "unit": "Unit 1: Solid State Physics", "q": "A hole in semiconductor physics is treated as:", "options": ["A) A positively charged quasiparticle with charge +e and positive effective mass", "B) A real free proton in the nucleus", "C) An electron moving with negative velocity", "D) A neutral neutron"], "ans": "A", "exp": "A hole is an empty electron state in the valence band behaving as a mobile positive quasiparticle with charge +e."}, {"num": 63, "unit": "Unit 1: Solid State Physics", "q": "If temperature of a pure semiconductor is increased, the Fermi level EF:", "options": ["A) Stays exactly at the center of the bandgap", "B) Deviates slightly depending on effective masses of electrons and holes: EF = (Ec+Ev)/2 + (3/4) kB T ln(mh*/me*)", "C) Jumps immediately to conduction band", "D) Becomes zero"], "ans": "B", "exp": "EF = (Ec+Ev)/2 + (3/4) kB T ln(mh*/me*); if mh* \u2248 me*, it stays essentially at the exact center."}, {"num": 64, "unit": "Unit 1: Solid State Physics", "q": "In a metal, electrical resistivity \u03c1 is proportional to relaxation time \u03c4 as:", "options": ["A) \u03c1 \u221d \u03c4", "B) \u03c1 \u221d 1 / \u03c4", "C) \u03c1 \u221d \u03c4\u00b2", "D) \u03c1 is independent of \u03c4"], "ans": "B", "exp": "Since \u03c3 = n e\u00b2 \u03c4 / m, resistivity \u03c1 = 1/\u03c3 = m / (n e\u00b2 \u03c4) \u221d 1/\u03c4."}, {"num": 65, "unit": "Unit 1: Solid State Physics", "q": "If a sample has a negative Hall coefficient RH < 0, the sign of majority charge carriers is:", "options": ["A) Positive (+q)", "B) Negative (-q, electrons)", "C) Neutral", "D) Indeterminate"], "ans": "B", "exp": "RH < 0 definitively proves that the majority charge carriers are electrons."}, {"num": 66, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "Kirchhoff's Current Law (KCL) is based on which fundamental conservation law?", "options": ["A) Conservation of Energy", "B) Conservation of Electric Charge (dq/dt = 0 at node)", "C) Conservation of Linear Momentum", "D) Conservation of Angular Momentum"], "ans": "B", "exp": "KCL states that algebraic sum of currents entering a node is zero (\u2211 I = 0), representing conservation of charge."}, {"num": 67, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "Kirchhoff's Voltage Law (KVL) is based on which fundamental conservation law?", "options": ["A) Conservation of Charge", "B) Conservation of Energy (work done moving around closed loop is zero)", "C) Conservation of Mass", "D) Newton's Third Law"], "ans": "B", "exp": "KVL states that algebraic sum of voltages around any closed loop is zero (\u2211 V = 0), representing conservation of energy."}, {"num": 68, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "In an unbiased PN junction at thermal equilibrium, the depletion region contains:", "options": ["A) Abundant free electrons and holes", "B) Immobile ionized donor (+q) and acceptor (-q) ions devoid of free mobile carriers", "C) Neutral Silicon atoms only", "D) Pure metallic contacts"], "ans": "B", "exp": "Diffusion leaves uncompensated immobile positive donor ions on N-side and negative acceptor ions on P-side."}, {"num": 69, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "The barrier potential (built-in potential V0) at 300 K is approximately ________ for Silicon and ________ for Germanium.", "options": ["A) 0.3 V and 0.7 V", "B) 0.7 V and 0.3 V", "C) 1.1 V and 0.67 V", "D) 2.0 V and 1.5 V"], "ans": "B", "exp": "Barrier potential is ~0.7 V for Silicon and ~0.3 V for Germanium at room temperature."}, {"num": 70, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "When a PN junction is forward biased (P connected to positive, N to negative):", "options": ["A) Depletion width widens and barrier height increases", "B) Depletion width narrows, barrier potential reduces (V0 - VF), and diffusion current increases exponentially", "C) No current can flow", "D) Zener breakdown occurs"], "ans": "B", "exp": "Forward bias opposes built-in barrier, shrinking depletion layer and enabling exponential majority carrier diffusion."}, {"num": 71, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "When a PN junction is reverse biased (P connected to negative, N to positive):", "options": ["A) Depletion layer widens, barrier height increases (V0 + VR), and only a tiny minority saturation current I0 flows", "B) Large diffusion current flows", "C) Barrier potential drops to zero", "D) Diode acts as a closed switch"], "ans": "A", "exp": "Reverse bias aids built-in field, expanding depletion width and restricting current to reverse saturation current I0."}, {"num": 72, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "The reverse saturation current I0 of a PN junction diode approximately:", "options": ["A) Halves for every 10 \u00b0C rise in temperature", "B) Doubles for every 10 \u00b0C rise in temperature", "C) Remains strictly independent of temperature", "D) Increases linearly with applied reverse voltage"], "ans": "B", "exp": "I0 is governed by thermally generated minority carriers and roughly doubles every 10 \u00b0C increase in temperature."}, {"num": 73, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "Zener breakdown occurs in PN junctions that are:", "options": ["A) Lightly doped with wide depletion region under high reverse voltage (> 6 V)", "B) Heavily doped with extremely narrow depletion region (< 10 nm) under moderate reverse voltage (< 6 V)", "C) Forward biased at 0.7 V", "D) Completely undoped"], "ans": "B", "exp": "Zener breakdown occurs in heavily doped junctions where intense electric field (> 10\u2076 V/cm) directly ruptures covalent bonds via quantum tunneling."}, {"num": 74, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "Avalanche breakdown in PN junctions is caused by:", "options": ["A) Direct electric field emission of valence electrons", "B) Impact ionization where accelerated minority carriers collide with lattice atoms, generating secondary electron-hole pairs", "C) High forward current", "D) Optical excitation"], "ans": "B", "exp": "Avalanche breakdown occurs in lightly doped diodes under higher reverse voltage via cumulative impact ionization."}, {"num": 75, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "The temperature coefficient of breakdown voltage is ________ for Zener breakdown and ________ for Avalanche breakdown.", "options": ["A) Positive; Negative", "B) Negative; Positive", "C) Zero; Zero", "D) Positive; Positive"], "ans": "B", "exp": "Zener breakdown voltage decreases with temperature (negative temp coeff), while Avalanche breakdown voltage increases with temperature (positive temp coeff)."}, {"num": 76, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "A Zener diode is operated in ________ bias to function as a ________.", "options": ["A) Forward; Rectifier", "B) Reverse breakdown region; Constant voltage regulator", "C) Forward; Variable capacitor", "D) Reverse; Solar energy collector"], "ans": "B", "exp": "In reverse breakdown, Zener diode maintains an almost perfectly constant voltage across its terminals despite current variations."}, {"num": 77, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "In a Bipolar Junction Transistor (BJT), the correct relationship among terminal currents is:", "options": ["A) IC = IE + IB", "B) IE = IB + IC", "C) IB = IE + IC", "D) IE = IC - IB"], "ans": "B", "exp": "By KCL applied to BJT package, total emitter current is sum of base and collector currents: IE = IB + IC."}, {"num": 78, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "The doping concentrations of the three BJT regions in descending order are:", "options": ["A) Collector > Base > Emitter", "B) Emitter > Collector > Base", "C) Base > Emitter > Collector", "D) Collector > Emitter > Base"], "ans": "B", "exp": "Emitter is heavily doped (to inject carriers), Collector is moderately doped, and Base is very lightly doped (and ultra-thin)."}, {"num": 79, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "The physical sizes (areas) of the three BJT regions in descending order are:", "options": ["A) Emitter > Base > Collector", "B) Collector > Emitter > Base", "C) Base > Collector > Emitter", "D) Emitter > Collector > Base"], "ans": "B", "exp": "Collector has the largest physical area to dissipate heat generated during collection of charge carriers."}, {"num": 80, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "For a BJT to operate in the Active Region (linear amplifier mode):", "options": ["A) Emitter-Base (EB) junction is Forward biased; Collector-Base (CB) junction is Reverse biased", "B) EB junction is Reverse biased; CB junction is Forward biased", "C) Both EB and CB junctions are Forward biased", "D) Both EB and CB junctions are Reverse biased"], "ans": "A", "exp": "Active mode requires forward-biased EB junction (injection) and reverse-biased CB junction (collection)."}, {"num": 81, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "For a BJT to operate as a closed switch (ON state in saturation):", "options": ["A) Both EB and CB junctions are Forward biased", "B) Both EB and CB junctions are Reverse biased", "C) EB forward biased, CB reverse biased", "D) EB reverse biased, CB forward biased"], "ans": "A", "exp": "In Saturation region, both junctions are forward biased, giving minimal VCE,sat (~0.2 V) and maximum current."}, {"num": 82, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "For a BJT to operate as an open switch (OFF state in cut-off):", "options": ["A) Both EB and CB junctions are Reverse biased", "B) Both EB and CB junctions are Forward biased", "C) EB forward biased, CB reverse biased", "D) Base is shorted to collector"], "ans": "A", "exp": "In Cut-off region, both junctions are reverse biased, resulting in zero terminal currents (open switch)."}, {"num": 83, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "The Common Base DC current gain (\u03b1) and Common Emitter DC current gain (\u03b2) are defined as:", "options": ["A) \u03b1 = IC / IE and \u03b2 = IC / IB", "B) \u03b1 = IB / IC and \u03b2 = IE / IC", "C) \u03b1 = IE / IC and \u03b2 = IC / IB", "D) \u03b1 = IC / IB and \u03b2 = IC / IE"], "ans": "A", "exp": "\u03b1 = IC / IE (typically 0.95 to 0.998) and \u03b2 = IC / IB (typically 20 to 500)."}, {"num": 84, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "The mathematical relationship between \u03b2 and \u03b1 is:", "options": ["A) \u03b2 = \u03b1 / (1 + \u03b1)", "B) \u03b2 = \u03b1 / (1 - \u03b1)", "C) \u03b2 = (1 - \u03b1) / \u03b1", "D) \u03b2 = 1 / (1 - \u03b1)"], "ans": "B", "exp": "Since IE = IB + IC, dividing by IC gives 1/\u03b1 = 1/\u03b2 + 1, which rearranges to \u03b2 = \u03b1 / (1 - \u03b1)."}, {"num": 85, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "If a transistor has \u03b1 = 0.99, its common emitter current gain \u03b2 is:", "options": ["A) 49", "B) 99", "C) 100", "D) 0.01"], "ans": "B", "exp": "\u03b2 = \u03b1 / (1 - \u03b1) = 0.99 / (1 - 0.99) = 0.99 / 0.01 = 99."}, {"num": 86, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "A CMOS inverter is constructed using:", "options": ["A) Two NMOS transistors in series", "B) One PMOS transistor as pull-up network and one NMOS transistor as pull-down network", "C) Two PMOS transistors in parallel", "D) One BJT and one diode"], "ans": "B", "exp": "CMOS inverter pairs a PMOS pull-up (connected to VDD) and an NMOS pull-down (connected to GND)."}, {"num": 87, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "In a CMOS inverter, when the input Vin is at Logic 1 (VDD):", "options": ["A) PMOS is ON, NMOS is OFF, Vout = VDD", "B) PMOS is OFF, NMOS is ON, Vout = 0 V (Logic 0)", "C) Both transistors are ON", "D) Both transistors are OFF"], "ans": "B", "exp": "High input turns NMOS ON and PMOS OFF, pulling output cleanly down to 0 V (GND)."}, {"num": 88, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "The primary advantage of CMOS technology in computer logic design is:", "options": ["A) High static power dissipation", "B) Near-zero static power dissipation because PMOS and NMOS are never ON simultaneously in steady state", "C) Requirement of negative supply voltage", "D) High output impedance"], "ans": "B", "exp": "In steady state (0 or 1), one transistor is always OFF, eliminating direct path from VDD to GND and yielding zero static power."}, {"num": 89, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "A solar cell converts solar radiation directly into electrical energy based on the:", "options": ["A) Thermionic emission", "B) Photovoltaic effect across a PN junction", "C) Seebeck effect", "D) Hall effect"], "ans": "B", "exp": "Solar cells operate via photovoltaic effect: light generates electron-hole pairs, separated by the junction field to create photovoltage."}, {"num": 90, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "In the I-V characteristic curve of a solar cell, the cell operates in the:", "options": ["A) First quadrant (power absorbing)", "B) Second quadrant", "C) Fourth quadrant (power delivering, V > 0 and I < 0)", "D) Third quadrant"], "ans": "C", "exp": "Solar cells deliver power to an external load, operating in the 4th quadrant of the I-V plane."}, {"num": 91, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "The Fill Factor (FF) of a solar cell is defined as:", "options": ["A) FF = (Voc \u00b7 Isc) / (Vmp \u00b7 Imp)", "B) FF = (Vmp \u00b7 Imp) / (Voc \u00b7 Isc) = Pmax / (Voc \u00b7 Isc)", "C) FF = Voc / Isc", "D) FF = Pout / Pin"], "ans": "B", "exp": "FF is the ratio of maximum deliverable power (Vmp \u00b7 Imp) to the product of open-circuit voltage Voc and short-circuit current Isc."}, {"num": 92, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "A solar cell has Voc = 0.6 V, Isc = 3.0 A, and maximum power point values Vmp = 0.5 V, Imp = 2.7 A. The Fill Factor is:", "options": ["A) 0.50", "B) 0.75 (75%)", "C) 0.90", "D) 1.25"], "ans": "B", "exp": "FF = (Vmp \u00b7 Imp) / (Voc \u00b7 Isc) = (0.5 * 2.7) / (0.6 * 3.0) = 1.35 / 1.80 = 0.75."}, {"num": 93, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "Light propagates through the core of an optical fiber via:", "options": ["A) Total Internal Reflection (TIR) at the core-cladding boundary", "B) Continuous refraction through cladding", "C) Electron conduction", "D) Magnetic induction"], "ans": "A", "exp": "Light is trapped and guided in optical fiber core through continuous Total Internal Reflection."}, {"num": 94, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "For Total Internal Reflection to occur in an optical fiber, the refractive indices must satisfy:", "options": ["A) Core refractive index n1 < Cladding refractive index n2", "B) Core refractive index n1 > Cladding refractive index n2", "C) n1 = n2", "D) Cladding must be metallic"], "ans": "B", "exp": "TIR requires light to travel from denser core (n1) toward rarer cladding (n2), so n1 > n2."}, {"num": 95, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "The critical angle \u03b8c at the core-cladding interface is given by:", "options": ["A) \u03b8c = sin\u207b\u00b9(n1 / n2)", "B) \u03b8c = sin\u207b\u00b9(n2 / n1)", "C) \u03b8c = cos\u207b\u00b9(n2 / n1)", "D) \u03b8c = tan\u207b\u00b9(n1 / n2)"], "ans": "B", "exp": "By Snell's Law, critical angle \u03b8c = sin\u207b\u00b9(n2 / n1). Light incident at angle > \u03b8c undergoes total internal reflection."}, {"num": 96, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "Numerical Aperture (NA) of an optical fiber measures its light gathering capacity and is defined in terms of acceptance angle \u03b8a as:", "options": ["A) NA = sin(\u03b8a) = \u221a(n1\u00b2 - n2\u00b2)", "B) NA = cos(\u03b8a) = \u221a(n1\u00b2 + n2\u00b2)", "C) NA = tan(\u03b8a) = n1 / n2", "D) NA = n1 - n2"], "ans": "A", "exp": "NA = sin(\u03b8a) = \u221a(n1\u00b2 - n2\u00b2) \u2248 n1 \u221a(2\u0394), where \u0394 is fractional index difference."}, {"num": 97, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "An optical fiber has core refractive index n1 = 1.50 and cladding index n2 = 1.48. The Numerical Aperture (NA) is:", "options": ["A) 0.020", "B) 0.244", "C) 0.500", "D) 0.987"], "ans": "B", "exp": "NA = \u221a(1.50\u00b2 - 1.48\u00b2) = \u221a(2.25 - 2.1904) = \u221a0.0596 \u2248 0.2441."}, {"num": 98, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "The condition for single-mode fiber (SMF) propagation in a step-index optical fiber is that the V-number must satisfy:", "options": ["A) V > 100", "B) V \u2264 2.405", "C) V = 0", "D) V \u2265 5.5"], "ans": "B", "exp": "A step-index fiber operates strictly in single mode (HE11) when normalized frequency V \u2264 2.405."}, {"num": 99, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "The total number of guided propagation modes M in a multimode step-index optical fiber with large V-number is approximately:", "options": ["A) M \u2248 V", "B) M \u2248 V\u00b2 / 2", "C) M \u2248 V\u00b2 / 4", "D) M \u2248 2 V\u00b2"], "ans": "B", "exp": "For step-index multimode fiber, M \u2248 V\u00b2 / 2. (For parabolic graded-index fiber, M \u2248 V\u00b2 / 4)."}, {"num": 100, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "A CPU architecture is fundamentally optimized for ________, whereas a GPU architecture is optimized for ________.", "options": ["A) High data throughput; Ultra-low instruction latency", "B) Ultra-low instruction latency with deep caches; Massive parallel data throughput with thousands of ALUs", "C) Graphics processing only; Serial pointer arithmetic only", "D) Zero memory bandwidth; High clock jitter"], "ans": "B", "exp": "CPUs optimize single-thread latency with large caches and branch prediction; GPUs optimize parallel throughput with thousands of SIMD cores."}, {"num": 101, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "In an electric circuit, electric power P dissipated in a resistor R carrying current I with voltage V is:", "options": ["A) P = V \u00b7 I = I\u00b2 R = V\u00b2 / R", "B) P = V / I = I / R", "C) P = V\u00b2 \u00b7 R", "D) P = I / V\u00b2"], "ans": "A", "exp": "Joule's law: P = V I = I\u00b2 R = V\u00b2 / R."}, {"num": 102, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "An electric bulb rated 100 W, 200 V has an internal operating resistance of:", "options": ["A) 2 \u03a9", "B) 200 \u03a9", "C) 400 \u03a9", "D) 20,000 \u03a9"], "ans": "C", "exp": "R = V\u00b2 / P = (200)\u00b2 / 100 = 40,000 / 100 = 400 \u03a9."}, {"num": 103, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "If three resistors of 6 \u03a9, 3 \u03a9, and 2 \u03a9 are connected in parallel, the equivalent resistance is:", "options": ["A) 11 \u03a9", "B) 1 \u03a9", "C) 0.5 \u03a9", "D) 3 \u03a9"], "ans": "B", "exp": "1/Req = 1/6 + 1/3 + 1/2 = 1/6 + 2/6 + 3/6 = 6/6 = 1 \u03a9\u207b\u00b9 => Req = 1 \u03a9."}, {"num": 104, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "The relationship between collector current IC, base current IB, and reverse saturation current ICBO in common emitter mode is:", "options": ["A) IC = \u03b2 IB + (1 + \u03b2) ICBO", "B) IC = \u03b2 IB + ICBO", "C) IC = \u03b1 IB + ICBO", "D) IC = \u03b2 IE"], "ans": "A", "exp": "IC = \u03b1 IE + ICBO = \u03b1 (IB + IC) + ICBO => IC = (\u03b1/(1-\u03b1)) IB + (1/(1-\u03b1)) ICBO = \u03b2 IB + (1 + \u03b2) ICBO."}, {"num": 105, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "In a BJT amplifier, the Common Collector (Emitter Follower) configuration provides:", "options": ["A) High voltage gain and low current gain", "B) Voltage gain \u2248 1, high current gain, high input impedance, and low output impedance (ideal buffer)", "C) High voltage gain and high output impedance", "D) Zero power gain"], "ans": "B", "exp": "Common Collector acts as a voltage buffer (Av \u2248 1) with high Zin and low Zout, perfect for impedance matching."}, {"num": 106, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "The Common Emitter (CE) configuration of BJT provides a phase shift between input and output voltage of:", "options": ["A) 0\u00b0 (in-phase)", "B) 90\u00b0", "C) 180\u00b0 (out-of-phase)", "D) 270\u00b0"], "ans": "C", "exp": "CE configuration introduces a 180\u00b0 phase inversion between input signal and amplified output voltage."}, {"num": 107, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "Fractional refractive index difference \u0394 in an optical fiber is defined as:", "options": ["A) \u0394 = (n1 - n2) / n1", "B) \u0394 = (n1 + n2) / n1", "C) \u0394 = (n1 - n2) / n2", "D) \u0394 = n1 \u00b7 n2"], "ans": "A", "exp": "Fractional index difference \u0394 = (n1 - n2) / n1, representing the relative step between core and cladding."}, {"num": 108, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "In a graded-index (GRIN) optical fiber, the refractive index of the core:", "options": ["A) Is strictly constant throughout the core", "B) Decreases parabolically from center axis toward the cladding", "C) Increases linearly toward the cladding", "D) Is lower than the cladding index"], "ans": "B", "exp": "GRIN core index decreases parabolically n(r) = n1 \u221a(1 - 2\u0394(r/a)\u00b2), equalizing transit times of different optical rays."}, {"num": 109, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "Intermodal dispersion is completely absent in which type of optical fiber?", "options": ["A) Multimode Step-Index Fiber", "B) Multimode Graded-Index Fiber", "C) Single-Mode Fiber (SMF)", "D) Plastic Optical Fiber"], "ans": "C", "exp": "Single-mode fiber supports only one fundamental propagation mode, inherently eliminating intermodal dispersion."}, {"num": 110, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "A step-index fiber has core radius a = 4 \u03bcm, NA = 0.15, operating at wavelength \u03bb = 1.3 \u03bcm. The V-number is:", "options": ["A) 2.90", "B) 1.50", "C) 5.80", "D) 0.85"], "ans": "A", "exp": "V = (2\u03c0 a / \u03bb) NA = (2 * 3.1416 * 4 / 1.3) * 0.15 = 19.333 * 0.15 \u2248 2.90."}, {"num": 111, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "The power conversion efficiency (\u03b7) of a solar cell is given by:", "options": ["A) \u03b7 = (Voc \u00b7 Isc \u00b7 FF / Pin) \u00d7 100%", "B) \u03b7 = (Pin / Pmax) \u00d7 100%", "C) \u03b7 = (Voc / Isc) \u00d7 100%", "D) \u03b7 = (FF / Pin) \u00d7 100%"], "ans": "A", "exp": "Efficiency \u03b7 = (Pmax / Pin) \u00d7 100% = (Voc \u00b7 Isc \u00b7 FF / Pin) \u00d7 100%."}, {"num": 112, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "A solar panel of area 1.5 m\u00b2 is exposed to solar irradiance of 1000 W/m\u00b2. If it delivers 225 W electrical power, its efficiency is:", "options": ["A) 10%", "B) 15%", "C) 22.5%", "D) 30%"], "ans": "B", "exp": "Pin = 1000 W/m\u00b2 * 1.5 m\u00b2 = 1500 W. Efficiency \u03b7 = (225 / 1500) \u00d7 100% = 15%."}, {"num": 113, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "In a CE transistor amplifier, if base current changes by 20 \u03bcA and collector current changes by 2 mA, the AC current gain \u03b2ac is:", "options": ["A) 10", "B) 100", "C) 50", "D) 200"], "ans": "B", "exp": "\u03b2ac = \u0394IC / \u0394IB = (2 \u00d7 10\u207b\u00b3 A) / (20 \u00d7 10\u207b\u2076 A) = 100."}, {"num": 114, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "The relationship between Common Collector current gain \u03b3 and Common Emitter current gain \u03b2 is:", "options": ["A) \u03b3 = \u03b2", "B) \u03b3 = 1 + \u03b2", "C) \u03b3 = \u03b2 - 1", "D) \u03b3 = \u03b2 / (1 + \u03b2)"], "ans": "B", "exp": "\u03b3 = IE / IB = (IB + IC) / IB = 1 + \u03b2."}, {"num": 115, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "In an NPN transistor, the majority charge carriers in the emitter and collector are:", "options": ["A) Holes", "B) Electrons", "C) Positive ions", "D) Photons"], "ans": "B", "exp": "In NPN BJT, Emitter (N) and Collector (N) have electrons as majority carriers, while Base (P) has holes."}, {"num": 116, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "In a PNP transistor, the majority charge carriers injected from emitter into base are:", "options": ["A) Holes", "B) Electrons", "C) Negative ions", "D) Neutrons"], "ans": "A", "exp": "In PNP BJT, Emitter is P-type, so it injects holes into the N-type base region."}, {"num": 117, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "A diode circuit has an AC dynamic resistance rd defined as:", "options": ["A) rd = V / I", "B) rd = \u0394V / \u0394I = \u03b7 VT / ID", "C) rd = ID / VT", "D) rd = 1 / (V \u00b7 I)"], "ans": "B", "exp": "Dynamic resistance is the slope reciprocal rd = dV/dI = \u03b7 VT / ID \u2248 26 mV / ID at room temperature."}, {"num": 118, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "For a Silicon diode carrying forward current ID = 26 mA at 300 K (taking ideality factor \u03b7 = 1), dynamic resistance rd is:", "options": ["A) 1 \u03a9", "B) 26 \u03a9", "C) 0.1 \u03a9", "D) 10 \u03a9"], "ans": "A", "exp": "rd = VT / ID = 26 mV / 26 mA = 1 \u03a9."}, {"num": 119, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "The ideal diode equation (Shockley equation) for current I as a function of voltage V is:", "options": ["A) I = I0 [exp(qV / \u03b7 kB T) - 1]", "B) I = I0 [exp(\u03b7 kB T / qV) + 1]", "C) I = I0 (qV / kB T)", "D) I = V / R"], "ans": "A", "exp": "Shockley diode equation is I = I0 [exp(V / \u03b7 VT) - 1]."}, {"num": 120, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "When a reverse bias VR >> VT is applied across a PN diode, the diode current approaches:", "options": ["A) 0 A", "B) -I0 (reverse saturation current)", "C) +I0", "D) -\u221e"], "ans": "B", "exp": "When V is negative and |V| >> VT, exp(V/VT) \u2192 0, so I = I0 (0 - 1) = -I0."}, {"num": 121, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "In a bridge rectifier circuit with sinusoidal AC input, the number of diodes conducting simultaneously in each half cycle is:", "options": ["A) 1", "B) 2", "C) 4", "D) 0"], "ans": "B", "exp": "In a bridge rectifier, two diagonally opposite diodes conduct simultaneously during each half cycle."}, {"num": 122, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "The ripple factor of an ideal full-wave rectifier without filter is approximately:", "options": ["A) 1.21", "B) 0.482", "C) 0.10", "D) 0.0"], "ans": "B", "exp": "Full-wave rectifier ripple factor is \u03b3 = \u221a( (Irms/Idc)\u00b2 - 1 ) \u2248 0.482 (compared to 1.21 for half-wave)."}, {"num": 123, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "The maximum theoretical rectification efficiency of a full-wave rectifier is:", "options": ["A) 40.6%", "B) 81.2%", "C) 50.0%", "D) 100%"], "ans": "B", "exp": "Full-wave rectifier maximum theoretical efficiency is 81.2% (twice that of a half-wave rectifier, 40.6%)."}, {"num": 124, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "In a BJT, the Early Effect (base-width modulation) is caused by:", "options": ["A) Variation of reverse-bias voltage across the collector-base junction altering the effective base width", "B) High temperature melting the base", "C) Heavy doping of emitter", "D) Forward biasing collector"], "ans": "A", "exp": "Higher reverse collector bias widens the CB depletion layer into the base, reducing the effective neutral base width."}, {"num": 125, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "Which BJT configuration is most widely used for voltage and power amplification?", "options": ["A) Common Base (CB)", "B) Common Emitter (CE)", "C) Common Collector (CC)", "D) Inverted Collector"], "ans": "B", "exp": "Common Emitter provides both high voltage gain and high current gain, yielding the highest power gain."}, {"num": 126, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "In a CMOS circuit, dynamic power dissipation during switching is given by:", "options": ["A) Pdyn = Cload \u00b7 VDD\u00b2 \u00b7 f", "B) Pdyn = VDD \u00b7 Istatic", "C) Pdyn = Cload \u00b7 VDD / f", "D) Pdyn = VDD\u00b2 / R"], "ans": "A", "exp": "Dynamic switching power is Pdyn = \u03b1 \u00b7 Cload \u00b7 VDD\u00b2 \u00b7 f, where f is switching clock frequency."}, {"num": 127, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "SIMD (Single Instruction, Multiple Data) execution model is characteristic of:", "options": ["A) Traditional single-core CPU control logic", "B) Modern GPU compute architectures for vector/matrix processing", "C) Hard disk drives", "D) Static RAM chips"], "ans": "B", "exp": "GPUs use SIMD/SIMT architectures where a single instruction stream operates on thousands of data points simultaneously."}, {"num": 128, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "Which component in a CPU architecture is responsible for predicting conditional jumps to avoid pipeline stalls?", "options": ["A) Arithmetic Logic Unit (ALU)", "B) Branch Predictor and Speculative Execution Unit", "C) Level 3 Cache", "D) Memory Management Unit (MMU)"], "ans": "B", "exp": "Branch prediction speculatively predicts execution paths to keep instruction pipelines full and reduce latency."}, {"num": 129, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "An optical fiber has NA = 0.20 and core index n1 = 1.46. The acceptance angle \u03b8a in air (n0 = 1.0) is:", "options": ["A) 11.54\u00b0", "B) 23.08\u00b0", "C) 45.0\u00b0", "D) 6.0\u00b0"], "ans": "A", "exp": "\u03b8a = sin\u207b\u00b9(NA) = sin\u207b\u00b9(0.20) \u2248 11.54\u00b0."}, {"num": 130, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "If the fractional index difference of a fiber is \u0394 = 0.01 and n1 = 1.5, the cladding index n2 is:", "options": ["A) 1.485", "B) 1.490", "C) 1.400", "D) 1.515"], "ans": "A", "exp": "\u0394 = (n1 - n2) / n1 => 0.01 = (1.5 - n2) / 1.5 => 0.015 = 1.5 - n2 => n2 = 1.485."}, {"num": 131, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "A Zener diode voltage regulator circuit has unregulated input Vin = 15 V, regulated Zener voltage VZ = 9 V, and series resistor Rs = 100 \u03a9. The total current through Rs is:", "options": ["A) 60 mA", "B) 90 mA", "C) 150 mA", "D) 6 mA"], "ans": "A", "exp": "Current through Rs is Is = (Vin - VZ) / Rs = (15 - 9) / 100 = 6 / 100 = 0.06 A = 60 mA."}, {"num": 132, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "In an optical fiber, attenuation (loss) is primarily caused by:", "options": ["A) Rayleigh scattering and material absorption (OH\u207b absorption bands)", "B) Cosmic rays only", "C) Light travelling too fast", "D) Magnetic interference from Earth"], "ans": "A", "exp": "Fiber losses stem from intrinsic Rayleigh scattering (\u221d 1/\u03bb\u2074) and absorption bands (such as water vapor OH\u207b ions)."}, {"num": 133, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "The standard telecommunication optical window with the lowest fiber attenuation (~0.2 dB/km) is at wavelength:", "options": ["A) 850 nm", "B) 1310 nm", "C) 1550 nm", "D) 632 nm"], "ans": "C", "exp": "Silica fiber has its global attenuation minimum (~0.2 dB/km) in the 1550 nm (C-band) window."}, {"num": 134, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "A BJT has collector current IC = 4.9 mA and base current IB = 100 \u03bcA. The emitter current IE is:", "options": ["A) 4.8 mA", "B) 5.0 mA", "C) 5.9 mA", "D) 4.9 mA"], "ans": "B", "exp": "IE = IC + IB = 4.9 mA + 0.1 mA = 5.0 mA."}, {"num": 135, "unit": "Unit 2: Electrical Laws, Devices, Optics & Computing", "q": "For the transistor in Q134 (IC = 4.9 mA, IE = 5.0 mA, IB = 0.1 mA), the current gains \u03b1 and \u03b2 are:", "options": ["A) \u03b1 = 0.98, \u03b2 = 49", "B) \u03b1 = 0.49, \u03b2 = 98", "C) \u03b1 = 0.99, \u03b2 = 100", "D) \u03b1 = 0.95, \u03b2 = 19"], "ans": "A", "exp": "\u03b1 = IC / IE = 4.9 / 5.0 = 0.98; \u03b2 = IC / IB = 4.9 / 0.1 = 49."}, {"num": 136, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "The binary equivalent of the decimal number (25)\u2081\u2080 is:", "options": ["A) (11001)\u2082", "B) (11010)\u2082", "C) (10011)\u2082", "D) (11101)\u2082"], "ans": "A", "exp": "25 = 16 + 8 + 1 = 11001 in binary (1\u00b716 + 1\u00b78 + 0\u00b74 + 0\u00b72 + 1\u00b71)."}, {"num": 137, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "The hexadecimal equivalent of the binary number (110110111100)\u2082 is:", "options": ["A) (DBC)\u2081\u2086", "B) (EBC)\u2081\u2086", "C) (DBE)\u2081\u2086", "D) (ABC)\u2081\u2086"], "ans": "A", "exp": "Group 4 bits from right: 1101 = D (13), 1011 = B (11), 1100 = C (12) => (DBC)\u2081\u2086."}, {"num": 138, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "The octal equivalent of the binary number (101110010)\u2082 is:", "options": ["A) (562)\u2088", "B) (572)\u2088", "C) (275)\u2088", "D) (652)\u2088"], "ans": "A", "exp": "Group 3 bits from right: 101 = 5, 110 = 6, 010 = 2 => (562)\u2088."}, {"num": 139, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "The 1's complement of the binary number 10110100 is obtained by:", "options": ["A) Adding 1 to the number", "B) Inverting each bit (0\u21921, 1\u21920), yielding 01001011", "C) Inverting only the MSB", "D) Shifting bits to left"], "ans": "B", "exp": "1's complement bit inversion: 10110100 becomes 01001011."}, {"num": 140, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "The 2's complement of the 8-bit binary number 00101100 is:", "options": ["A) 11010011", "B) 11010100", "C) 11010001", "D) 00101101"], "ans": "B", "exp": "1's complement = 11010011. Adding 1 gives 11010011 + 1 = 11010100. (Or keep bits up to first 1 from right, invert rest)."}, {"num": 141, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "In an 8-bit 2's complement signed number system, the decimal range of representable numbers is:", "options": ["A) -127 to +127", "B) -128 to +127", "C) 0 to 255", "D) -256 to +255"], "ans": "B", "exp": "For n-bit 2's complement, range is -2^(n-1) to +(2^(n-1) - 1). For n=8, -128 to +127."}, {"num": 142, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "A major advantage of 2's complement representation over 1's complement is that 2's complement:", "options": ["A) Has two distinct representations for zero (+0 and -0)", "B) Has a unique representation for zero (00000000) and simplified subtraction circuitry", "C) Requires more hardware", "D) Cannot represent negative numbers"], "ans": "B", "exp": "2's complement eliminates negative zero (-0) and allows subtraction to be performed directly with adder hardware by discarding the final end-carry."}, {"num": 143, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "When subtracting binary numbers using 1's complement, if an end-around carry is generated, it must be:", "options": ["A) Discarded", "B) Added to the Least Significant Bit (LSB)", "C) Subtracted from MSB", "D) Multiplied by 2"], "ans": "B", "exp": "In 1's complement arithmetic, an end carry indicates a positive result and must be added back to the LSB (end-around carry)."}, {"num": 144, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "When subtracting binary numbers using 2's complement, if a final end carry is generated:", "options": ["A) The result is positive and the end carry is discarded", "B) The end carry is added to the LSB", "C) The result is negative and must be complemented", "D) An arithmetic overflow has definitely occurred"], "ans": "A", "exp": "In 2's complement, an end carry signifies the result is positive and the carry is simply discarded."}, {"num": 145, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "The BCD (Binary Coded Decimal / 8421 code) representation of decimal number 87 is:", "options": ["A) 1010111", "B) 1000 0111", "C) 0111 1000", "D) 1000 0101"], "ans": "B", "exp": "Encode each decimal digit into 4 bits: 8 = 1000, 7 = 0111 => 1000 0111."}, {"num": 146, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "Which of the following 4-bit combinations is an INVALID BCD code?", "options": ["A) 0101", "B) 1001", "C) 1100", "D) 0000"], "ans": "C", "exp": "Valid BCD covers 0000 (0) to 1001 (9). 1010 (10) through 1111 (15) are invalid BCD states."}, {"num": 147, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "The Excess-3 code for decimal number 5 is:", "options": ["A) 0101", "B) 1000", "C) 0011", "D) 1010"], "ans": "B", "exp": "Excess-3 = Decimal + 3 = 5 + 3 = 8 => (1000)\u2082 in 4-bit binary."}, {"num": 148, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "Excess-3 code is known as a 'self-complementing code' because:", "options": ["A) Its 1's complement produces the 9's complement of the corresponding decimal digit", "B) Its 2's complement is 0", "C) It uses only NAND gates", "D) It has unit Hamming distance"], "ans": "A", "exp": "Inverting all bits of an Excess-3 code word gives the Excess-3 code of the 9's complement of that decimal digit."}, {"num": 149, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "Gray Code is called a 'unit distance code' because:", "options": ["A) Every code word has exactly one '1'", "B) Consecutive code words differ in only one bit position", "C) It represents numbers in distance units", "D) It has zero parity"], "ans": "B", "exp": "Gray code ensures only one bit flips between any two adjacent numbers, preventing spurious glitches/hazards in encoders and K-maps."}, {"num": 150, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "The Gray code equivalent of binary number 1011 is:", "options": ["A) 1110", "B) 1101", "C) 0110", "D) 1001"], "ans": "A", "exp": "G3 = B3 = 1; G2 = B3 \u2295 B2 = 1 \u2295 0 = 1; G1 = B2 \u2295 B1 = 0 \u2295 1 = 1; G0 = B1 \u2295 B0 = 1 \u2295 1 = 0 => 1110."}, {"num": 151, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "The binary equivalent of Gray code 1101 is:", "options": ["A) 1001", "B) 1000", "C) 1010", "D) 1111"], "ans": "A", "exp": "B3 = G3 = 1; B2 = B3 \u2295 G2 = 1 \u2295 1 = 0; B1 = B2 \u2295 G1 = 0 \u2295 0 = 0; B0 = B1 \u2295 G0 = 0 \u2295 1 = 1 => 1001."}, {"num": 152, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "Which of the following pairs of logic gates are called Universal Logic Gates?", "options": ["A) AND and OR", "B) NAND and NOR", "C) XOR and XNOR", "D) NOT and AND"], "ans": "B", "exp": "NAND and NOR can independently implement any arbitrary Boolean function (AND, OR, NOT, XOR, XNOR)."}, {"num": 153, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "The minimum number of 2-input NAND gates required to implement a 2-input XOR gate is:", "options": ["A) 3", "B) 4", "C) 5", "D) 2"], "ans": "B", "exp": "XOR gate requires exactly 4 NAND gates. (XNOR requires 5 NAND gates)."}, {"num": 154, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "The minimum number of 2-input NOR gates required to implement a 2-input XOR gate is:", "options": ["A) 4", "B) 5", "C) 3", "D) 2"], "ans": "B", "exp": "XOR gate requires 5 NOR gates. (XNOR requires 4 NOR gates)."}, {"num": 155, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "The minimum number of 2-input NAND gates required to implement a 2-input AND gate is:", "options": ["A) 1", "B) 2", "C) 3", "D) 4"], "ans": "B", "exp": "NAND followed by NAND-as-inverter gives (A\u00b7B)'' = A\u00b7B, requiring 2 NAND gates."}, {"num": 156, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "The minimum number of 2-input NAND gates required to implement a 2-input OR gate is:", "options": ["A) 2", "B) 3", "C) 4", "D) 1"], "ans": "B", "exp": "By De Morgan's, A + B = (A' \u00b7 B')'. Invert A (1 NAND), invert B (1 NAND), then NAND together (1 NAND) = 3 NAND gates."}, {"num": 157, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "According to De Morgan's First Law, (A + B)' is equivalent to:", "options": ["A) A' + B'", "B) A' \u00b7 B'", "C) A \u00b7 B", "D) (A \u00b7 B)'"], "ans": "B", "exp": "De Morgan's Theorem 1: Complement of a sum equals product of complements: (A + B)' = A' \u00b7 B'."}, {"num": 158, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "According to De Morgan's Second Law, (A \u00b7 B)' is equivalent to:", "options": ["A) A' \u00b7 B'", "B) A' + B'", "C) A + B", "D) (A + B)'"], "ans": "B", "exp": "De Morgan's Theorem 2: Complement of a product equals sum of complements: (A \u00b7 B)' = A' + B'."}, {"num": 159, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "The Boolean expression A + A'B simplifies to:", "options": ["A) A", "B) A + B", "C) A \u00b7 B", "D) B"], "ans": "B", "exp": "By Distributive Law: A + A'B = (A + A')(A + B) = 1 \u00b7 (A + B) = A + B."}, {"num": 160, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "The Boolean expression A(A' + B) simplifies to:", "options": ["A) A + B", "B) A \u00b7 B", "C) A'", "D) 0"], "ans": "B", "exp": "A \u00b7 A' + A \u00b7 B = 0 + A \u00b7 B = A \u00b7 B."}, {"num": 161, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "According to the Consensus Theorem, the expression AB + A'C + BC simplifies to:", "options": ["A) AB + A'C", "B) BC", "C) AB + BC", "D) A'C + BC"], "ans": "A", "exp": "Consensus theorem: BC is the redundant consensus term of AB and A'C, so AB + A'C + BC = AB + A'C."}, {"num": 162, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "The dual of the Boolean expression A + B\u00b7C = (A + B)(A + C) is obtained by:", "options": ["A) Replacing + with \u00b7, \u00b7 with +, and swapping 0 and 1, yielding A \u00b7 (B + C) = (A \u00b7 B) + (A \u00b7 C)", "B) Complementing every literal", "C) Inverting only the LHS", "D) Multiplying by 2"], "ans": "A", "exp": "Duality principle: Swap AND (\u00b7) and OR (+), and swap 0 and 1 without complementing literals."}, {"num": 163, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "In a Karnaugh Map (K-Map), adjacent cells are arranged according to:", "options": ["A) Natural binary sequence (00, 01, 10, 11)", "B) Gray code sequence (00, 01, 11, 10)", "C) BCD code", "D) Excess-3 code"], "ans": "B", "exp": "K-Map columns and rows use Gray code (00, 01, 11, 10) so adjacent physical cells differ by exactly one bit."}, {"num": 164, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "A 4-variable K-Map contains a total of ________ cells.", "options": ["A) 4", "B) 8", "C) 16", "D) 32"], "ans": "C", "exp": "Number of cells for n variables is 2\u207f. For n=4, 2\u2074 = 16 cells."}, {"num": 165, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "In a K-Map, valid cell groupings must contain a number of 1s equal to:", "options": ["A) Any integer (1, 2, 3, 4, 5...)", "B) A power of 2 (1, 2, 4, 8, 16...)", "C) Multiples of 3", "D) Odd numbers only"], "ans": "B", "exp": "Valid groups must be powers of 2 (2^k) in rectangular or square shapes."}, {"num": 166, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "In a 4-variable K-map for F(A,B,C,D), grouping the 4 corner cells (m0, m2, m8, m10) simplifies to:", "options": ["A) A'C'", "B) B'D'", "C) BD", "D) A'D'"], "ans": "B", "exp": "m0(0000), m2(0010), m8(1000), m10(1010). Row A varies (0,1), B is constant 0 (B'). Column C varies (0,1), D is constant 0 (D') => B'D'."}, {"num": 167, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "A 'Don't Care' condition (d or X) in a K-Map:", "options": ["A) Must always be included in every group", "B) Must never be grouped with 1s", "C) Can be treated as 1 if it helps form a larger group, or treated as 0 otherwise", "D) Inverts the output to 0"], "ans": "C", "exp": "Don't Care terms provide flexibility: include as 1 only if they enlarge a group to minimize literals; ignore as 0 otherwise."}, {"num": 168, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "An Essential Prime Implicant (EPI) is a prime implicant that:", "options": ["A) Covers at least one minterm '1' that is not covered by any other prime implicant", "B) Covers all minterms", "C) Contains don't care conditions only", "D) Can be safely deleted without affecting logic"], "ans": "A", "exp": "EPI must be included in the minimal SOP expression because it uniquely covers at least one 1-cell."}, {"num": 169, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "The canonical Sum of Products (SOP) form of a logic function represents the logic using:", "options": ["A) Maxterms (\u03a0 M)", "B) Minterms (\u03a3 m)", "C) NOR gates only", "D) XOR gates only"], "ans": "B", "exp": "Canonical SOP is a sum (OR) of fundamental product terms (minterms \u03a3 m)."}, {"num": 170, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "The canonical Product of Sums (POS) form of a logic function represents the logic using:", "options": ["A) Minterms (\u03a3 m)", "B) Maxterms (\u03a0 M)", "C) NAND gates only", "D) XNOR gates only"], "ans": "B", "exp": "Canonical POS is a product (AND) of fundamental sum terms (maxterms \u03a0 M)."}, {"num": 171, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "For a 3-variable function F(A,B,C), the minterm m5 corresponds to:", "options": ["A) A' B C'", "B) A B' C", "C) A B C'", "D) A' B' C"], "ans": "B", "exp": "5 in binary is 101 => A=1, B=0, C=1 => product term A B' C."}, {"num": 172, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "For a 3-variable function F(A,B,C), the maxterm M5 corresponds to:", "options": ["A) A' + B + C'", "B) A + B' + C", "C) A' + B' + C", "D) A + B + C'"], "ans": "A", "exp": "For maxterms, 0 is uncomplemented and 1 is complemented. 5 = 101 => A' + B + C'."}, {"num": 173, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "The output of a 2-input XOR gate is Logic 1 if and only if:", "options": ["A) Both inputs are 1", "B) Both inputs are 0", "C) The two inputs are different (one is 0, other is 1)", "D) Both inputs are identical"], "ans": "C", "exp": "XOR (exclusive OR) outputs 1 when inputs are unequal (odd parity detector: 0\u22951=1, 1\u22950=1)."}, {"num": 174, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "The output of a 2-input XNOR gate (Equivalence Gate) is Logic 1 when:", "options": ["A) The two inputs are identical (both 0 or both 1)", "B) Inputs are different", "C) Input A is 1 only", "D) Input B is 1 only"], "ans": "A", "exp": "XNOR outputs 1 when inputs are equal (0\u22990=1, 1\u22991=1), acting as a coincidence detector."}, {"num": 175, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "The logic expression (A \u2295 B) \u2295 B simplifies to:", "options": ["A) A", "B) B", "C) 1", "D) 0"], "ans": "A", "exp": "By associativity and property B \u2295 B = 0: (A \u2295 B) \u2295 B = A \u2295 (B \u2295 B) = A \u2295 0 = A."}, {"num": 176, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "The Boolean identity A \u2295 1 is equal to:", "options": ["A) A", "B) A' (NOT A)", "C) 1", "D) 0"], "ans": "B", "exp": "A \u2295 1 = A\u00b71' + A'\u00b71 = 0 + A' = A'."}, {"num": 177, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "The Boolean identity A \u2295 0 is equal to:", "options": ["A) A", "B) A'", "C) 0", "D) 1"], "ans": "A", "exp": "A \u2295 0 = A\u00b70' + A'\u00b70 = A\u00b71 + 0 = A."}, {"num": 178, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "In a 3-variable K-map for F(A,B,C) = \u03a3 m(0, 1, 2, 3), the minimal simplified expression is:", "options": ["A) A'", "B) B'", "C) C'", "D) A"], "ans": "A", "exp": "m0, m1, m2, m3 occupy the entire top row where A=0 => A'."}, {"num": 179, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "In a 3-variable K-map for F(A,B,C) = \u03a3 m(1, 3, 5, 7), the minimal simplified expression is:", "options": ["A) A", "B) B", "C) C", "D) C'"], "ans": "C", "exp": "All four minterms have C=1 across all combinations of A and B => C."}, {"num": 180, "unit": "Unit 3: Digital Electronics, Logic & K-Maps", "q": "In a 4-variable K-map, grouping an entire column of 4 cells eliminates ________ variables, leaving a product term with ________ variables.", "options": ["A) 1; 3", "B) 2; 2", "C) 3; 1", "D) 4; 0"],
