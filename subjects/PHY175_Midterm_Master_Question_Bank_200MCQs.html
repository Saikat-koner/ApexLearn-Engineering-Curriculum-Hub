<!DOCTYPE html>

<head>

<title>PHY175: Midterm Master 200-MCQ Suite & Revision Engine</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
    --bg-primary: #0f172a;
    --bg-secondary: #1e293b;
    --bg-card: #243248;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --accent: #38bdf8;
    --accent-hover: #0ea5e9;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --border: #334155;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
body { background: var(--bg-primary); color: var(--text-primary); line-height: 1.6; padding: 20px; }
.container { max-width: 1200px; margin: 0 auto; }
header { text-align: center; padding: 30px 20px; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border-radius: 16px; border: 1px solid var(--border); margin-bottom: 24px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
h1 { font-size: 2.2rem; font-weight: 800; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
.badge { display: inline-block; padding: 4px 12px; border-radius: 9999px; font-size: 0.85rem; font-weight: 600; background: rgba(56, 189, 248, 0.15); color: var(--accent); border: 1px solid rgba(56, 189, 248, 0.3); margin: 4px; }
.nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.tab-btn { padding: 12px 24px; border-radius: 10px; background: var(--bg-secondary); color: var(--text-secondary); border: 1px solid var(--border); font-weight: 600; cursor: pointer; transition: all 0.2s; }
.tab-btn.active, .tab-btn:hover { background: var(--accent); color: #0f172a; border-color: var(--accent); }
.search-box { width: 100%; padding: 14px 20px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; color: var(--text-primary); font-size: 1rem; margin-bottom: 20px; outline: none; }
.search-box:focus { border-color: var(--accent); }
.q-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 16px; transition: transform 0.2s, box-shadow 0.2s; }
.q-card:hover { border-color: #475569; }
.q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.q-unit { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: var(--accent); letter-spacing: 0.05em; }
.q-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 14px; color: #ffffff; }
.options-grid { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 14px; }
.opt-btn { text-align: left; padding: 12px 16px; background: var(--bg-card); border: 1px solid #334155; border-radius: 8px; color: var(--text-primary); cursor: pointer; transition: all 0.15s; font-size: 0.95rem; }
.opt-btn:hover { background: #2d3e58; border-color: var(--accent); }
.opt-btn.correct { background: rgba(16, 185, 129, 0.2) !important; border-color: var(--success) !important; color: #34d399 !important; font-weight: 600; }
.opt-btn.wrong { background: rgba(239, 68, 68, 0.2) !important; border-color: var(--danger) !important; color: #f87171 !important; }
.explanation { display: none; margin-top: 12px; padding: 14px; background: rgba(15, 23, 42, 0.8); border-left: 4px solid var(--accent); border-radius: 6px; font-size: 0.9rem; color: #cbd5e1; }
.exp-toggle { background: none; border: none; color: var(--accent); font-weight: 600; cursor: pointer; font-size: 0.85rem; padding: 4px 0; text-decoration: underline; }
.stats-bar { display: flex; gap: 16px; margin-bottom: 20px; background: var(--bg-secondary); padding: 16px; border-radius: 12px; border: 1px solid var(--border); }
.stat-item { flex: 1; text-align: center; }
.stat-val { font-size: 1.5rem; font-weight: 800; color: var(--accent); }
.stat-lbl { font-size: 0.8rem; color: var(--text-secondary); text-transform: uppercase; }
@media (max-width: 768px) {
    h1 { font-size: 1.6rem; }
    .stats-bar { flex-direction: column; gap: 10px; }
}
</style>
</head>
